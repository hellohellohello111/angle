name: Build ANGLE with Shadow Fixes
on:
  push:
    branches:
      - shadow-fix-v3
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clone upstream ANGLE
      run: |
        git clone https://chromium.googlesource.com/angle/angle.git
        cd angle
        echo "Upstream HEAD: $(git log -1 --oneline)"

    - name: Apply metal freeze patch
      run: |
        cd angle
        sed -i '' '/^[[:space:]]*UNIMPLEMENTED();/{
        N
        s/UNIMPLEMENTED();\n[[:space:]]*break;/UNIMPLEMENTED();\
                    *available = true;\
                    break;/
        }' src/libANGLE/renderer/metal/QueryMtl.mm
        echo "Metal freeze patch:"
        grep -n -A1 'UNIMPLEMENTED' src/libANGLE/renderer/metal/QueryMtl.mm | head -5

    - name: Write shadow fix script
      run: |
        cat > /tmp/apply_shadow_fixes.py << 'SCRIPT_END'
        import sys

        # ============================================================
        # FIX 1 & 2: FrameBufferMtl.mm
        # ============================================================
        path1 = "angle/src/libANGLE/renderer/metal/FrameBufferMtl.mm"
        with open(path1, "r") as f:
            lines = f.readlines()

        output = []
        i = 0
        fix1_applied = False
        fix2_applied = False

        while i < len(lines):
            line = lines[i]

            # FIX 1: In setLoadStoreActionOnRenderPassFirstStart, change:
            #   else { attachment.loadAction = MTLLoadActionLoad; }
            # to:
            #   else if (attachment.loadAction != MTLLoadActionClear) { ... }
            #
            # This preserves Clear loadAction set by glClear() so shadow FBOs
            # get properly cleared instead of loading stale data.
            if (not fix1_applied
                and "attachment.storeAction == MTLStoreActionDontCare" in line
                and i + 8 < len(lines)):
                # Look ahead for the else { loadAction = Load } block
                j = i
                while j < min(i + 12, len(lines)):
                    if "    else" in lines[j] and "attachment.loadAction = MTLLoadActionLoad" in lines[j+2:j+3][0] if j+2 < len(lines) else False:
                        # Found it - output everything up to the else
                        while i < j:
                            output.append(lines[i])
                            i += 1
                        # Replace else with else if
                        output.append("    else if (attachment.loadAction != MTLLoadActionClear)\n")
                        output.append("    {\n")
                        output.append("        // Only override to Load if not already set to Clear by a pending glClear().\n")
                        output.append("        attachment.loadAction = MTLLoadActionLoad;\n")
                        output.append("    }\n")
                        # Skip the original else block (else, {, loadAction=Load, })
                        i = j
                        while i < len(lines) and "}" not in lines[i]:
                            i += 1
                        i += 1  # skip the closing }
                        fix1_applied = True
                        print("FIX 1 applied: setLoadStoreActionOnRenderPassFirstStart")
                        break
                    j += 1
                if fix1_applied:
                    continue

            # FIX 2: In ensureRenderPassStarted, change unconditional:
            #   colorAttachment.loadAction = MTLLoadActionLoad;
            #   depthAttachment.loadAction = MTLLoadActionLoad;
            #   stencilAttachment.loadAction = MTLLoadActionLoad;
            # to conditional (only if not Clear):
            #   if (colorAttachment.loadAction != MTLLoadActionClear)
            #       colorAttachment.loadAction = MTLLoadActionLoad;
            # etc.
            if (not fix2_applied
                and "mRenderPassCleanStart" in line
                and "if" in line
                and i + 10 < len(lines)):
                # Check if this is the right block
                block = "".join(lines[i:i+12])
                if "mRenderPassCleanStart = false" in block and "colorAttachment.loadAction = MTLLoadActionLoad" in block:
                    # Output the if and the comment and mRenderPassCleanStart = false
                    output.append(line)
                    i += 1
                    output.append(lines[i])  # {
                    i += 1
                    # Output comment lines and mRenderPassCleanStart = false
                    while i < len(lines):
                        output.append(lines[i])
                        if "mRenderPassCleanStart = false" in lines[i]:
                            i += 1
                            break
                        i += 1
                    # Now replace the for loop and depth/stencil assignments
                    # Skip to for loop
                    while i < len(lines) and "for" not in lines[i]:
                        output.append(lines[i])
                        i += 1
                    # Output the for loop header
                    output.append(lines[i])  # for (...)
                    i += 1
                    output.append(lines[i])  # {
                    i += 1
                    # Replace the unconditional assignment with conditional
                    while i < len(lines):
                        if "colorAttachment.loadAction = MTLLoadActionLoad" in lines[i]:
                            indent = "            "
                            output.append(indent + "if (colorAttachment.loadAction != MTLLoadActionClear)\n")
                            output.append(indent + "{\n")
                            output.append(lines[i])  # original assignment
                            output.append(indent + "}\n")
                            i += 1
                            continue
                        if "depthAttachment.loadAction" in lines[i] and "MTLLoadActionLoad" in lines[i]:
                            indent = "        "
                            output.append(indent + "if (mRenderPassDesc.depthAttachment.loadAction != MTLLoadActionClear)\n")
                            output.append(indent + "{\n")
                            output.append(lines[i])
                            output.append(indent + "}\n")
                            i += 1
                            continue
                        if "stencilAttachment.loadAction" in lines[i] and "MTLLoadActionLoad" in lines[i]:
                            indent = "        "
                            output.append(indent + "if (mRenderPassDesc.stencilAttachment.loadAction != MTLLoadActionClear)\n")
                            output.append(indent + "{\n")
                            output.append(lines[i])
                            output.append(indent + "}\n")
                            i += 1
                            continue
                        output.append(lines[i])
                        if lines[i].strip() == "}" and i + 1 < len(lines) and lines[i+1].strip() == "":
                            i += 1
                            fix2_applied = True
                            print("FIX 2 applied: ensureRenderPassStarted")
                            break
                        i += 1
                    continue

            output.append(line)
            i += 1

        if not fix1_applied:
            print("WARNING: FIX 1 pattern not found - trying fallback")
        if not fix2_applied:
            print("WARNING: FIX 2 pattern not found - trying fallback")

        with open(path1, "w") as f:
            f.writelines(output)

        # ============================================================
        # FIX 3: ContextMtl.mm - selective force-store (color only)
        # ============================================================
        path3 = "angle/src/libANGLE/renderer/metal/ContextMtl.mm"
        with open(path3, "r") as f:
            content = f.read()

        old = "mRenderEncoder.setStoreAction(MTLStoreActionStore)"
        new = "mRenderEncoder.setColorStoreAction(MTLStoreActionStore)"
        if old in content:
            content = content.replace(old, new)
            print("FIX 3 applied: selective force-store (color only)")
        else:
            print("WARNING: FIX 3 pattern not found")

        with open(path3, "w") as f:
            f.write(content)

        SCRIPT_END

    - name: Apply shadow fixes
      run: |
        python3 /tmp/apply_shadow_fixes.py
        echo "=== Verify fixes ==="
        echo "--- FIX 1 & 2 ---"
        grep -n "MTLLoadActionClear" angle/src/libANGLE/renderer/metal/FrameBufferMtl.mm | head -10
        echo "--- FIX 3 ---"
        grep -n "setColorStoreAction\|setStoreAction" angle/src/libANGLE/renderer/metal/ContextMtl.mm | head -5

    - name: Sync dependencies
      run: |
        cd angle
        python3 scripts/bootstrap.py
        gclient sync

    - name: Configure and build
      run: |
        cd angle
        mkdir -p out/Release
        cat > out/Release/args.gn << 'GNEOF'
        target_cpu="arm64"
        is_debug=false
        mac_sdk_min="12.0"
        mac_min_system_version="12.0"
        mac_deployment_target="12.0"
        angle_enable_metal=true
        angle_enable_swiftshader=false
        angle_enable_vulkan=false
        GNEOF
        gn gen out/Release
        autoninja -C out/Release libEGL libGLESv2
        ls -la out/Release/libEGL.dylib out/Release/libGLESv2.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: angle-shadow-fix
        path: |
          angle/out/Release/libEGL.dylib
          angle/out/Release/libGLESv2.dylib
