name: Build ANGLE — Skip All Invalidation on MoltenVK
on:
  push:
    branches:
      - depth-clear-fix
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clone upstream ANGLE
      run: |
        git clone https://chromium.googlesource.com/angle/angle.git
        cd angle
        echo "Upstream HEAD: $(git log -1 --oneline)"

    - name: Apply metal freeze patch
      run: |
        cat > /tmp/patch_metal_freeze.py << 'PYEOF'
        import sys
        path = "angle/src/libANGLE/renderer/metal/QueryMtl.mm"
        with open(path, "r") as f:
            content = f.read()
        fn = content.find("QueryMtl::isResultAvailable")
        if fn == -1:
            print("ERROR: isResultAvailable not found")
            sys.exit(1)
        marker = "UNIMPLEMENTED();"
        idx = content.find(marker, fn)
        if idx != -1:
            insert_pos = idx + len(marker)
            nl = content[insert_pos]
            spaces = ""
            j = insert_pos + 1
            while j < len(content) and content[j] == " ":
                spaces += " "
                j += 1
            content = content[:insert_pos] + "\n" + spaces + "*available = true;" + content[insert_pos:]
            print("Metal freeze patch applied in isResultAvailable")
        else:
            print("WARNING: UNIMPLEMENTED not found in isResultAvailable")
        with open(path, "w") as f:
            f.write(content)
        PYEOF
        python3 /tmp/patch_metal_freeze.py

    - name: Apply skip-all-invalidation patch
      run: |
        cat > /tmp/patch_skip_invalidate.py << 'PYEOF'
        import sys

        # ============================================================
        # FIX: vk_helpers.cpp — Skip ALL glInvalidateFramebuffer calls
        #
        # On MoltenVK/Metal TBDR, when ANGLE converts glInvalidateFramebuffer
        # to VK_ATTACHMENT_STORE_OP_DONT_CARE, tile memory is not stored to
        # system memory. The next render pass then reads stale data from the
        # previous frame, causing a full-screen ghost pattern visible against
        # dark backgrounds.
        #
        # preferSkippingInvalidateForEmulatedFormats only skips invalidation
        # for emulated-channel color attachments. This patch makes ALL
        # invalidation skip unconditionally — color (even non-emulated),
        # depth, and stencil — so no attachment ever gets DontCare from
        # glInvalidateFramebuffer.
        #
        # The performance cost is that ANGLE can't optimize away unused
        # attachment stores, but this is negligible on Apple Silicon where
        # tile memory store is fast.
        # ============================================================

        path = "angle/src/libANGLE/renderer/vulkan/vk_helpers.cpp"
        with open(path, "r") as f:
            lines = f.readlines()

        fixes_applied = 0

        # Find the invalidateEntireContent helper that checks aspect type.
        # The pattern we're looking for:
        #
        #   switch (aspect)
        #   {
        #       case VK_IMAGE_ASPECT_DEPTH_BIT:
        #           skip = hasEmulatedDepthChannel();
        #           break;
        #       case VK_IMAGE_ASPECT_STENCIL_BIT:
        #           skip = hasEmulatedStencilChannel();
        #           break;
        #       case VK_IMAGE_ASPECT_COLOR_BIT:
        #           skip = hasEmulatedChannels &&
        #                  contextVk->getFeatures().preferSkippingInvalidateForEmulatedFormats.enabled;
        #           break;
        #   }
        #
        # Replace ALL skip assignments with: skip = true;

        i = 0
        while i < len(lines):
            line = lines[i]

            # Match "skip = hasEmulatedDepthChannel();"
            if "skip = hasEmulatedDepthChannel();" in line:
                indent = line[:len(line) - len(line.lstrip())]
                lines[i] = indent + "skip = true;  // PATCHED: always skip invalidation on MoltenVK\n"
                fixes_applied += 1
                print(f"FIX {fixes_applied} at line {i+1}: depth invalidation -> always skip")

            # Match "skip = hasEmulatedStencilChannel();"
            elif "skip = hasEmulatedStencilChannel();" in line:
                indent = line[:len(line) - len(line.lstrip())]
                lines[i] = indent + "skip = true;  // PATCHED: always skip invalidation on MoltenVK\n"
                fixes_applied += 1
                print(f"FIX {fixes_applied} at line {i+1}: stencil invalidation -> always skip")

            # Match the color case: "skip = hasEmulatedChannels &&"
            # followed by "contextVk->getFeatures().preferSkippingInvalidateForEmulatedFormats.enabled;"
            elif "skip = hasEmulatedChannels &&" in line:
                indent = line[:len(line) - len(line.lstrip())]
                lines[i] = indent + "skip = true;  // PATCHED: always skip invalidation on MoltenVK\n"
                # Remove the continuation line
                if i + 1 < len(lines) and "preferSkippingInvalidateForEmulatedFormats" in lines[i+1]:
                    lines[i+1] = ""
                fixes_applied += 1
                print(f"FIX {fixes_applied} at line {i+1}: color invalidation -> always skip")

            i += 1

        if fixes_applied < 3:
            print(f"WARNING: Only {fixes_applied}/3 fixes applied. Dumping context...")
            with open(path, "r") as f:
                for i, line in enumerate(f, 1):
                    if "hasEmulated" in line and "skip" in line:
                        print(f"  Line {i}: {line.rstrip()}")
                    if "preferSkippingInvalidate" in line:
                        print(f"  Line {i}: {line.rstrip()}")
            if fixes_applied == 0:
                sys.exit(1)

        print(f"\nTotal fixes applied: {fixes_applied}")

        with open(path, "w") as f:
            f.writelines(lines)

        # Verify
        print("\n=== Verification ===")
        with open(path, "r") as f:
            for i, line in enumerate(f, 1):
                if "PATCHED" in line:
                    print(f"  Line {i}: {line.rstrip()}")
        PYEOF
        python3 /tmp/patch_skip_invalidate.py

    - name: Sync dependencies
      run: |
        cd angle
        python3 scripts/bootstrap.py
        gclient sync

    - name: Configure and build
      run: |
        cd angle
        mkdir -p out/Release
        cat > out/Release/args.gn << 'GNEOF'
        target_cpu="arm64"
        is_debug=false
        mac_sdk_min="12.0"
        mac_min_system_version="12.0"
        mac_deployment_target="12.0"
        angle_enable_metal=true
        angle_enable_swiftshader=false
        angle_enable_vulkan=true
        GNEOF
        gn gen out/Release
        autoninja -C out/Release libEGL libGLESv2
        ls -la out/Release/libEGL.dylib out/Release/libGLESv2.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: angle-skip-invalidation
        path: |
          angle/out/Release/libEGL.dylib
          angle/out/Release/libGLESv2.dylib
