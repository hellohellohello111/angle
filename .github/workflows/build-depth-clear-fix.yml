name: Build ANGLE with Vulkan Depth Clear Fix
on:
  push:
    branches:
      - depth-clear-fix
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clone upstream ANGLE
      run: |
        git clone https://chromium.googlesource.com/angle/angle.git
        cd angle
        echo "Upstream HEAD: $(git log -1 --oneline)"

    - name: Apply metal freeze patch
      run: |
        cat > /tmp/patch_metal_freeze.py << 'PYEOF'
        import sys
        path = "angle/src/libANGLE/renderer/metal/QueryMtl.mm"
        with open(path, "r") as f:
            content = f.read()
        fn = content.find("QueryMtl::isResultAvailable")
        if fn == -1:
            print("ERROR: isResultAvailable not found")
            sys.exit(1)
        marker = "UNIMPLEMENTED();"
        idx = content.find(marker, fn)
        if idx != -1:
            insert_pos = idx + len(marker)
            nl = content[insert_pos]
            spaces = ""
            j = insert_pos + 1
            while j < len(content) and content[j] == " ":
                spaces += " "
                j += 1
            content = content[:insert_pos] + "\n" + spaces + "*available = true;" + content[insert_pos:]
            print("Metal freeze patch applied in isResultAvailable")
        else:
            print("WARNING: UNIMPLEMENTED not found in isResultAvailable")
        with open(path, "w") as f:
            f.write(content)
        PYEOF
        python3 /tmp/patch_metal_freeze.py

    - name: Apply Vulkan depth DontCare fix
      run: |
        cat > /tmp/patch_vulkan_depth.py << 'PYEOF'
        import sys, re

        # ============================================================
        # FIX: FramebufferVk.cpp - Convert depth DontCare to Clear(1.0)
        #
        # When depth content is undefined, ANGLE sets loadOp = DontCare.
        # On MoltenVK, VK_ATTACHMENT_LOAD_OP_DONT_CARE preserves previous
        # frame data in tile memory, causing shadow map ghosting.
        #
        # Fix: Change DontCare to Clear with depth=1.0 (far plane) so
        # unrendered shadow texels read as "no shadow" instead of stale.
        # ============================================================

        path = "angle/src/libANGLE/renderer/vulkan/FramebufferVk.cpp"
        with open(path, "r") as f:
            lines = f.readlines()

        fixes_applied = 0

        # Find the pattern:
        #   if (!depthStencilRenderTarget->hasDefinedContent() ||
        #       depthStencilRenderTarget->isEntirelyTransient())
        #   {
        #       depthLoadOp = vk::RenderPassLoadOp::DontCare;
        #   }
        #
        # Replace DontCare with Clear for depth.

        for i in range(len(lines)):
            stripped = lines[i].strip()

            # Fix 1: Undefined/transient depth content -> Clear instead of DontCare
            if (stripped == "depthLoadOp = vk::RenderPassLoadOp::DontCare;"
                and i >= 2):
                # Check context: is this the hasDefinedContent / isEntirelyTransient block?
                context = "".join(lines[max(0,i-5):i])
                if "hasDefinedContent" in context or "isEntirelyTransient" in context:
                    indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                    lines[i] = indent + "depthLoadOp = vk::RenderPassLoadOp::Clear;  // PATCHED: was DontCare, causes ghosting on MoltenVK\n"
                    fixes_applied += 1
                    print(f"FIX 1 applied at line {i+1}: depth DontCare -> Clear (undefined content)")

        # Now ensure the clear value for depth is 1.0 when no deferred clears.
        # Find the else clause that stores kUninitializedClearValue for depth/stencil
        # and replace it with a proper depth=1.0 clear value.
        #
        # Pattern:
        #   else
        #   {
        #       packedClearValues.storeDepthStencil(depthStencilAttachmentIndex,
        #                                           kUninitializedClearValue);
        #   }

        for i in range(len(lines)):
            if ("packedClearValues.storeDepthStencil" in lines[i]
                and "kUninitializedClearValue" in lines[i]):
                # This is the else clause - replace with depth=1.0
                indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                # Check if it spans multiple lines
                block_start = i
                block_end = i
                full_stmt = lines[i]
                while ";" not in full_stmt and block_end < len(lines) - 1:
                    block_end += 1
                    full_stmt += lines[block_end]

                # Replace the whole statement
                replacement = []
                replacement.append(indent + "// PATCHED: Use depth=1.0 (far plane) instead of uninitialized\n")
                replacement.append(indent + "VkClearValue depthFarClear = {};\n")
                replacement.append(indent + "depthFarClear.depthStencil.depth = 1.0f;\n")
                replacement.append(indent + "depthFarClear.depthStencil.stencil = 0;\n")
                replacement.append(indent + "packedClearValues.storeDepthStencil(depthStencilAttachmentIndex,\n")
                replacement.append(indent + "                                    depthFarClear);\n")

                # Replace lines block_start through block_end
                lines[block_start:block_end+1] = replacement
                fixes_applied += 1
                print(f"FIX 2 applied at line {block_start+1}: kUninitializedClearValue -> depth=1.0")
                break

        if fixes_applied == 0:
            print("ERROR: No fixes applied! Dumping context...")
            for i, line in enumerate(lines, 1):
                if "depthLoadOp" in line and "DontCare" in line:
                    print(f"  Line {i}: {line.rstrip()}")
                if "kUninitializedClearValue" in line:
                    print(f"  Line {i}: {line.rstrip()}")
            sys.exit(1)
        else:
            print(f"\nTotal fixes applied: {fixes_applied}")

        with open(path, "w") as f:
            f.writelines(lines)

        # Verify
        print("\n=== Verification ===")
        with open(path, "r") as f:
            for i, line in enumerate(f, 1):
                if "PATCHED" in line or "depthFarClear" in line:
                    print(f"  Line {i}: {line.rstrip()}")
        PYEOF
        python3 /tmp/patch_vulkan_depth.py

    - name: Sync dependencies
      run: |
        cd angle
        python3 scripts/bootstrap.py
        gclient sync

    - name: Configure and build
      run: |
        cd angle
        mkdir -p out/Release
        cat > out/Release/args.gn << 'GNEOF'
        target_cpu="arm64"
        is_debug=false
        mac_sdk_min="12.0"
        mac_min_system_version="12.0"
        mac_deployment_target="12.0"
        angle_enable_metal=true
        angle_enable_swiftshader=false
        angle_enable_vulkan=true
        GNEOF
        gn gen out/Release
        autoninja -C out/Release libEGL libGLESv2
        ls -la out/Release/libEGL.dylib out/Release/libGLESv2.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: angle-vulkan-depth-fix
        path: |
          angle/out/Release/libEGL.dylib
          angle/out/Release/libGLESv2.dylib
