name: Build ANGLE with Depth Clear Fix
on:
  push:
    branches:
      - depth-clear-fix
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clone upstream ANGLE
      run: |
        git clone https://chromium.googlesource.com/angle/angle.git
        cd angle
        echo "Upstream HEAD: $(git log -1 --oneline)"

    - name: Apply metal freeze patch
      run: |
        cat > /tmp/patch_metal_freeze.py << 'PYEOF'
        import sys
        path = "angle/src/libANGLE/renderer/metal/QueryMtl.mm"
        with open(path, "r") as f:
            content = f.read()
        fn = content.find("QueryMtl::isResultAvailable")
        if fn == -1:
            print("ERROR: isResultAvailable not found")
            sys.exit(1)
        marker = "UNIMPLEMENTED();"
        idx = content.find(marker, fn)
        if idx != -1:
            insert_pos = idx + len(marker)
            nl = content[insert_pos]
            spaces = ""
            j = insert_pos + 1
            while j < len(content) and content[j] == " ":
                spaces += " "
                j += 1
            content = content[:insert_pos] + "\n" + spaces + "*available = true;" + content[insert_pos:]
            print("Metal freeze patch applied in isResultAvailable")
        else:
            print("WARNING: UNIMPLEMENTED not found in isResultAvailable")
        with open(path, "w") as f:
            f.write(content)
        PYEOF
        python3 /tmp/patch_metal_freeze.py

    - name: Apply depth clear fix
      run: |
        cat > /tmp/patch_depth_clear.py << 'PYEOF'
        import sys

        path = "angle/src/libANGLE/renderer/metal/mtl_command_buffer.mm"
        with open(path, "r") as f:
            content = f.read()

        # Find the RandomizeClearValue specialization for depth attachments.
        # Original code randomizes clearDepth to a value in [0.0, 1.0].
        # We change it to always use 1.0 (far plane) so that any shadow map
        # texels not re-rendered this frame read as "no shadow" instead of
        # random depth values that cause ghost shadow artifacts.

        # Replace ALL occurrences of randomized depth clear with fixed 1.0.
        # Patterns found in ANGLE source:
        #   objCRenderPassAttachment.clearDepth = dist(rd);
        #   mRenderPassDesc.depthAttachment.clearDepth = dis(gen);
        # We replace any line containing ".clearDepth = d" (where d is a
        # distribution call) with ".clearDepth = 1.0"

        import re
        # Match any line that assigns clearDepth from a distribution/random call
        pattern = r'(\.clearDepth\s*=\s*)\w+\(\w+\)'
        replacement = r'\g<1>1.0  /* FIXED: far plane instead of random */'
        new_content, count = re.subn(pattern, replacement, content)

        if count == 0:
            # Fallback: try broader pattern
            pattern2 = r'(\.clearDepth\s*=\s*)[^;]+;'
            # Only replace lines that look like random assignments (not literal values)
            lines = content.split('\n')
            new_lines = []
            count = 0
            for line in lines:
                if '.clearDepth' in line and ('dist(' in line or 'dis(' in line or 'distribution' in line):
                    # Replace the assignment value with 1.0
                    new_line = re.sub(r'(\.clearDepth\s*=\s*)[^;]+', r'\g<1>1.0  /* FIXED: far plane */', line)
                    new_lines.append(new_line)
                    count += 1
                    print(f"Fixed: {line.strip()} -> {new_line.strip()}")
                else:
                    new_lines.append(line)
            new_content = '\n'.join(new_lines)

        if count == 0:
            print("WARNING: No depth clear randomization found, dumping clearDepth context:")
            for i, line in enumerate(content.split('\n'), 1):
                if 'clearDepth' in line.lower() or 'cleardepth' in line:
                    print(f"  Line {i}: {line.rstrip()}")
            # Don't fail - the fix may not be needed if ANGLE changed the approach
        else:
            print(f"Depth clear fix applied: {count} occurrence(s) changed to 1.0")

        content = new_content

        with open(path, "w") as f:
            f.write(content)

        print("Depth clear fix applied: random -> 1.0")

        # Verify
        with open(path, "r") as f:
            for i, line in enumerate(f, 1):
                if "clearDepth" in line:
                    print(f"  Line {i}: {line.rstrip()}")
        PYEOF
        python3 /tmp/patch_depth_clear.py

    - name: Sync dependencies
      run: |
        cd angle
        python3 scripts/bootstrap.py
        gclient sync

    - name: Configure and build
      run: |
        cd angle
        mkdir -p out/Release
        cat > out/Release/args.gn << 'GNEOF'
        target_cpu="arm64"
        is_debug=false
        mac_sdk_min="12.0"
        mac_min_system_version="12.0"
        mac_deployment_target="12.0"
        angle_enable_metal=true
        angle_enable_swiftshader=false
        angle_enable_vulkan=false
        GNEOF
        gn gen out/Release
        autoninja -C out/Release libEGL libGLESv2
        ls -la out/Release/libEGL.dylib out/Release/libGLESv2.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: angle-depth-clear-fix
        path: |
          angle/out/Release/libEGL.dylib
          angle/out/Release/libGLESv2.dylib
