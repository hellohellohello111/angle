name: Build ANGLE (Rebased Metal)
on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clone upstream ANGLE (latest)
      run: |
        git clone https://chromium.googlesource.com/angle/angle.git
        cd angle
        echo "Upstream HEAD: $(git log -1 --oneline)"

    - name: Apply mcpelauncher patches
      run: |
        cd angle

        # Patch 1: workaround: metal freeze (QueryMtl.mm)
        # Adds *available = true in default case to prevent hang
        cat > /tmp/metal-freeze.patch << 'PATCHEOF'
        --- a/src/libANGLE/renderer/metal/QueryMtl.mm
        +++ b/src/libANGLE/renderer/metal/QueryMtl.mm
        @@ -180,6 +180,7 @@
                     break;
                 default:
                     UNIMPLEMENTED();
        +            *available = true;
                     break;
             }
             return angle::Result::Continue;
        PATCHEOF

        # Patch 2: opengl backend fix contentscale updates (WindowSurfaceCGL.mm)
        cat > /tmp/contentscale.patch << 'PATCHEOF'
        --- a/src/libANGLE/renderer/gl/cgl/WindowSurfaceCGL.mm
        +++ b/src/libANGLE/renderer/gl/cgl/WindowSurfaceCGL.mm
        @@ -258,7 +258,7 @@
             unsigned height = getHeight();
             auto &texture   = *mSwapState.beingRendered;

        -    if (texture.width != width || texture.height != height)
        +    if (mSwapLayer.contentsScale != mLayer.contentsScale || texture.width != width || texture.height != height)
             {
                 stateManager->bindTexture(gl::TextureType::_2D, texture.texture);
                 functions->texImage2D(GL_TEXTURE_2D, 0, GL_RGBA, width, height, 0, GL_RGBA,
        @@ -269,6 +269,7 @@

                 texture.width  = width;
                 texture.height = height;
        +        [mSwapLayer setContentsScale:[mLayer contentsScale]];
             }

             ASSERT(mFramebufferID ==
        PATCHEOF

        # Apply patches - use fuzzy matching since line numbers may differ
        git apply --ignore-whitespace /tmp/metal-freeze.patch || echo "WARN: metal-freeze patch needs manual apply"
        git apply --ignore-whitespace /tmp/contentscale.patch || echo "WARN: contentscale patch needs manual apply"

        # Verify patches applied
        echo "=== Checking QueryMtl.mm ==="
        grep -A2 'UNIMPLEMENTED' src/libANGLE/renderer/metal/QueryMtl.mm | head -5
        echo "=== Checking WindowSurfaceCGL.mm ==="
        grep 'contentsScale' src/libANGLE/renderer/gl/cgl/WindowSurfaceCGL.mm | head -5

    - name: Sync dependencies
      run: |
        cd angle
        python3 scripts/bootstrap.py
        gclient sync

    - name: Configure build
      run: |
        cd angle
        mkdir -p out/Release
        cat > out/Release/args.gn << 'GNARGS'
        target_cpu="arm64"
        is_debug=false
        mac_sdk_min="11.0"
        mac_min_system_version="11.0"
        mac_deployment_target="11.0"
        angle_enable_metal=true
        angle_enable_swiftshader=false
        angle_enable_vulkan=false
        GNARGS
        echo "args.gn contents:"
        cat out/Release/args.gn
        gn gen out/Release

    - name: Build
      run: |
        cd angle
        autoninja -C out/Release libEGL libGLESv2
        echo "Build complete!"
        ls -la out/Release/libEGL.dylib out/Release/libGLESv2.dylib

    - name: Package artifacts
      run: |
        cd angle
        mkdir -p artifacts
        cp out/Release/libEGL.dylib artifacts/
        cp out/Release/libGLESv2.dylib artifacts/
        echo "$(git log -1 --oneline)" > artifacts/BUILD_INFO.txt
        echo "Built: $(date -u)" >> artifacts/BUILD_INFO.txt
        echo "Patches applied: metal-freeze, contentscale" >> artifacts/BUILD_INFO.txt

    - name: Upload ANGLE dylibs
      uses: actions/upload-artifact@v4
      with:
        name: angle-metal-arm64-rebased
        path: angle/artifacts/
